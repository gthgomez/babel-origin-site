name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # This repo intentionally has no lockfile, so no npm cache is configured.

      - name: Content check and build public/
        run: npm run build

      - name: Validate vercel.json
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"

      - name: Validate HTML
        run: npx --yes html-validate@11.15.0 "public/**/*.html"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --root-dir "${{ github.workspace }}/public"
            --no-progress
            --accept 100..=103,200..=299,429
            './public/**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: public/
          if-no-files-found: ignore
