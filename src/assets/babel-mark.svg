<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#4da3ff" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#1f5fd0" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cbcff"/>
      <stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
  </defs>
  <g filter="url(#glow)" fill="none" stroke="url(#beam)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- bracket arms -->
    <path d="M14 14 L8 14 L8 50 L14 50"/>
    <path d="M50 14 L56 14 L56 50 L50 50"/>
    <!-- head -->
    <rect x="20" y="18" width="24" height="24" rx="7" fill="#0d1420"/>
    <!-- eyes -->
    <path d="M27.5 25 L27.5 34" stroke-width="5.5"/>
    <path d="M36.5 25 L36.5 34" stroke-width="5.5"/>
    <!-- feet -->
    <path d="M27 48 L25 53"/>
    <path d="M37 48 L39 53"/>
  </g>
</svg>
